name: Deploy to VPS on master

on:
  push:
    branches: [master]

jobs:
  # ─── CI Gate ────────────────────────────────────────────────────────────────
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_AUTH_API_URL: ${{ vars.NEXT_PUBLIC_AUTH_API_URL }}
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
      KEYCLOAK_REALM_URL: "http://localhost:8080/auth/realms/bfp"
      KEYCLOAK_CLIENT_ID: "bfp-client"
      KEYCLOAK_AUDIENCE: "account"
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/wims_test"
      REDIS_URL: "redis://localhost:6379/0"
      WIMS_MASTER_KEY: ${{ secrets.WIMS_MASTER_KEY }}
    services:
      postgres:
        image: postgis/postgis:15-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: src/frontend

      - name: Run frontend build
        run: npm run build
        working-directory: src/frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: src/frontend

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend deps
        run: pip install -r src/backend/requirements.txt

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -U postgres && echo "PostgreSQL ready" && break
            echo "Waiting... ($i/30)"
            sleep 1
          done

      - name: Initialize test database
        run: |
          export PGPASSWORD=postgres
          find "$GITHUB_WORKSPACE/src/postgres-init" -maxdepth 1 -type f -name '*.sql' -print0 \
            | LC_ALL=C sort -z \
            | while IFS= read -r -d '' script; do
                echo "Applying: ${script#$GITHUB_WORKSPACE/}"
                psql -v ON_ERROR_STOP=1 -h localhost -p 5432 -U postgres -d wims_test \
                  -f "$script"
              done

      - name: Run backend tests
        run: pytest -v --tb=short --ignore=tests/test_rate_limiting.py --ignore=tests/test_suricata_ingestion.py --ignore=tests/test_infra_config.py --ignore=tests/integration/test_wims_initial_schema_bootstrap.py --ignore=tests/integration/test_auth_otp_policy.py --ignore=tests/integration/test_database_schema.py --ignore=tests/integration/test_rls_policy_enforcement.py --ignore=tests/integration/test_sql_quality_audit.py
        working-directory: src/backend

  # ─── Deploy (only if CI passes) ─────────────────────────────────────────────
  deploy:
    needs: [ci]
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      KEYCLOAK_REALM_URL: ${{ secrets.KEYCLOAK_REALM_URL }}
      KEYCLOAK_CLIENT_ID: ${{ secrets.KEYCLOAK_CLIENT_ID }}
      KEYCLOAK_AUDIENCE: ${{ secrets.KEYCLOAK_AUDIENCE }}
      WIMS_MASTER_KEY: ${{ secrets.WIMS_MASTER_KEY }}
      FIREBASE_CREDENTIALS_PATH: ${{ secrets.FIREBASE_CREDENTIALS_PATH }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
      DEPLOY_COMMIT: ${{ github.sha }}
    steps:
      - name: Provision TLS certificate via certbot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/wims-bfp/letsencrypt

            if ! command -v certbot &> /dev/null; then
              echo "Installing certbot..."
              apt-get update -qq
              apt-get install -y -qq certbot python3-certbot-nginx
            fi

            echo "Running certbot for 165-22-101-73.nip.io..."
            certbot certonly \
              --nginx \
              --non-interactive \
              --agree-tos \
              --email x1n4te@proton.me \
              --domains 165-22-101-73.nip.io \
              --cert-name 165-22-101-73.nip.io \
              --keep-until-expiring \
              --deploy-hook "docker compose -f /opt/wims-bfp/src/docker-compose.yml exec nginx-gateway nginx -s reload" \
              --webroot -w /tmp/letsencrypt || true

            echo "Certbot done — certificate installed at /etc/letsencrypt/live/165-22-101-73.nip.io/"

            printf 'SHELL=/bin/sh\nPATH=/usr/local/sbin:/usr/local/bin:/sbin:/bin:/usr/sbin:/usr/bin\n0 0,12 * * * root sleep $(head -c 2 /dev/urandom | od -An -t u1 | tr -d " ") && certbot renew --quiet --deploy-hook "docker compose -f /opt/wims-bfp/src/docker-compose.yml exec nginx-gateway nginx -s reload"\n' > /etc/cron.d/certbot-renewal
            echo "Certbot auto-renewal cron installed."

      - name: Tag previous image for rollback
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            PREV_IMAGE=$(docker compose -f /opt/wims-bfp/src/docker-compose.yml images -q backend | head -n 1)
            if [ -n "$PREV_IMAGE" ]; then
              echo "Tagging previous backend image for rollback: $PREV_IMAGE"
              docker tag "$PREV_IMAGE" wims-backend-rollback:latest
            else
              echo "No existing backend image found — skipping rollback tag"
            fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,REDIS_URL,KEYCLOAK_REALM_URL,KEYCLOAK_CLIENT_ID,KEYCLOAK_AUDIENCE,WIMS_MASTER_KEY,FIREBASE_CREDENTIALS_PATH,KEYCLOAK_ADMIN_PASSWORD,KEYCLOAK_ADMIN_CLIENT_SECRET
          timeout: 15m
          script: |
            set -euo pipefail

            export DATABASE_URL="$DATABASE_URL"
            export REDIS_URL="$REDIS_URL"
            export KEYCLOAK_REALM_URL="$KEYCLOAK_REALM_URL"
            export KEYCLOAK_CLIENT_ID="$KEYCLOAK_CLIENT_ID"
            export KEYCLOAK_AUDIENCE="$KEYCLOAK_AUDIENCE"
            export WIMS_MASTER_KEY="$WIMS_MASTER_KEY"
            export FIREBASE_CREDENTIALS_PATH="$FIREBASE_CREDENTIALS_PATH"
            export KEYCLOAK_ADMIN_PASSWORD="$KEYCLOAK_ADMIN_PASSWORD"
            export KEYCLOAK_ADMIN_CLIENT_SECRET="$KEYCLOAK_ADMIN_CLIENT_SECRET"

            cd /opt/wims-bfp
            git fetch origin master
            git checkout -B master origin/master
            cd src

            # Pre-deploy DB connectivity check
            echo "Checking database connectivity..."
            docker compose run --rm -T backend python -c "from database import get_engine; from sqlalchemy import text; engine = get_engine(); conn = engine.connect(); conn.execute(text('SELECT 1')); conn.close(); print('DB connection OK')" || { echo 'DB connectivity check failed — aborting deploy'; exit 1; }

            # Build and restart
            echo "Building and restarting containers..."
            docker compose build backend
            docker compose up -d backend

            # ─── Post-deploy health check ───────────────────────────────────────
            echo "Waiting for backend to be ready..."
            BACKEND_READY=0
            for i in $(seq 1 30); do
              if curl -sf http://localhost/api/health > /dev/null 2>&1; then
                echo "Backend /health check passed"
                BACKEND_READY=1
                break
              fi
              echo "Attempt $i/30: backend not ready yet..."
              sleep 2
            done

            if [ "$BACKEND_READY" = "0" ]; then
              echo "Backend health check failed — initiating rollback"
              docker tag wims-backend-rollback:latest wims-backend:latest 2>/dev/null || true
              docker compose up -d backend
              echo "Rollback complete"
              exit 1
            fi

            echo "Deploy successful — commit $DEPLOY_COMMIT"
            echo "DEPLOY_COMMIT=$DEPLOY_COMMIT $(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> /opt/wims-bfp/.deploy_history
