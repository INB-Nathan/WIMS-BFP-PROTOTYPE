# CI override for GitHub Actions security-scan and any automated Compose workflow
# that must not require TLS certificates.
#
# This file deliberately supersedes docker-compose.override.yml (the local-dev
# HTTP→HTTPS nginx.local.conf mount) and instead mounts the HTTP-only
# nginx.ci.conf so nginx starts without needing /etc/letsencrypt certificates.
#
# Usage (from src/):
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build
#
# The base docker-compose.yml also mounts nginx.conf (production TLS), but the
# ci override is listed after docker-compose.yml and its nginx config mount
# takes precedence.
services:
  nginx-gateway:
    volumes:
      - ./nginx/nginx.ci.conf:/etc/nginx/nginx.conf:ro

  # Shared GitHub-hosted runners bring up the entire stack (postgres, keycloak,
  # ollama model pull, backend, celery, frontend build) at once and can see
  # postgres pass its healthcheck and then get killed under memory/CPU
  # contention shortly after. This only widens the retry tolerance for CI —
  # user/db/password are untouched, matching docker-compose.yml exactly.
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wims"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
