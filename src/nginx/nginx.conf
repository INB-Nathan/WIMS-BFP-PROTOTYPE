events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server backend:8000;
        keepalive 32;
    }

    client_max_body_size 50M;

    # Health check location — nginx handles /health directly without proxying to backend.
    # External uptime monitors (DigitalOcean Uptime, UptimeRobot) can verify the gateway
    # is reachable even if the backend is restarting.
    location = /health {
        access_log off;
        return 200 '{"status":"ok","via":"nginx-gateway"}\n';
        add_header Content-Type application/json;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name 165-22-101-73.nip.io;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── TLS termination ────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name 165-22-101-73.nip.io;

        ssl_certificate     /etc/letsencrypt/live/165-22-101-73.nip.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/165-22-101-73.nip.io/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Use Docker's embedded DNS resolver with a short TTL so nginx re-resolves
        # upstream hostnames on every request. Without this, nginx caches the IP
        # at startup time — if any upstream container restarts and gets a new IP,
        # all traffic to that upstream returns 502 until nginx is also restarted.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # Auth routes (session, callback, logout) handled by Next.js frontend
        location /api/auth/ {
            set $upstream_frontend http://frontend:3000;
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Keep cookie Domain in sync between nginx-gateway and browser
            proxy_cookie_domain nginx-gateway $host;
            # CORS headers — backend does not add them, so nginx provides them.
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;

            # Handle OPTIONS preflight directly — do not proxy to backend.
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location /auth/ {
            set $upstream_keycloak http://keycloak:8080;
            proxy_pass $upstream_keycloak;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            set $upstream_frontend2 http://frontend:3000;
            proxy_pass $upstream_frontend2;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
