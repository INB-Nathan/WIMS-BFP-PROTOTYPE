events {
    worker_connections 1024;
}

http {
    upstream backend_servers {
        server backend:8000;
        keepalive 32;
    }

    client_max_body_size 50M;

    # Health check location — nginx handles /health directly without proxying to backend.
    # External uptime monitors (DigitalOcean Uptime, UptimeRobot) can verify the gateway
    # is reachable even if the backend is restarting.
    location = /health {
        access_log off;
        return 200 '{"status":"ok","via":"nginx-gateway"}\n';
        add_header Content-Type application/json;
    }

    server {
        listen 80;
        listen [::]:80;
        
        # In a real scenario, you'd add SSL config for 443 here
        # listen 443 ssl;
        # listen [::]:443 ssl;

        # Auth routes (session, callback, logout) handled by Next.js frontend
        location /api/auth/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Rewrite Domain=nginx-gateway set by backend → Domain=localhost so
            # the browser accepts the cookie when accessing via http://localhost.
            proxy_cookie_domain nginx-gateway localhost;
            # CORS headers — backend does not add them, so nginx provides them.
            # Allow requests from the browser on any port during development.
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;

            # Handle OPTIONS preflight directly — do not proxy to backend.
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $http_origin always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
