events {
    worker_connections 1024;
}

http {
    server_tokens off;
    proxy_hide_header X-Powered-By;

    upstream backend_servers {
        server backend:8000;
        keepalive 32;
    }

    client_max_body_size 50M;

    # ---------- DoS hardening --------------------------------------------------
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     65s;
    send_timeout          10s;

    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # public_api:   tight limit for the unauthenticated zero-trust DMZ endpoint.
    # civilian_api: mid-tier limit for the civilian report form (higher blast radius).
    # general_api:  relaxed limit for all other backend routes.
    # Both public_api and civilian_api use $realip_remote_addr (TCP socket IP,
    # pre-real-IP-module) so the zone key cannot be rotated by spoofing XFF.
    limit_req_zone  $realip_remote_addr zone=public_api:10m    rate=10r/s;
    limit_req_zone  $realip_remote_addr zone=civilian_api:10m  rate=5r/s;
    limit_req_zone  $binary_remote_addr zone=general_api:10m   rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    limit_req_status  429;
    limit_conn_status 429;
    # ---------------------------------------------------------------------------

    # CI-only HTTP server — no TLS, no certs required.
    # Used by GitHub Actions security-scan job via docker-compose.ci.yml.
    # Local dev using docker-compose.override.yml gets the HTTPS nginx.local.conf
    # (requires self-signed certs generated in .ssl/).
    # Production uses nginx.conf with real Let's Encrypt certs via docker-compose.prod.yml.
    server {
        listen 80;
        listen [::]:80;
        server_name localhost wimsbfp.tech;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com; connect-src 'self' https://*.tile.openstreetmap.org https://wimsbfp.tech; font-src 'self' https://fonts.gstatic.com; worker-src 'self' https://www.gstatic.com; frame-src 'self'; frame-ancestors 'self'" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","via":"nginx-gateway"}\n';
        }

        location /api/auth/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/v1/public/ {
            limit_req  zone=public_api burst=5 nodelay;
            limit_conn addr 10;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            # Use the pre-real-IP-module socket address so the backend rate
            # limiter cannot be bypassed by a spoofed X-Forwarded-For header.
            proxy_set_header X-Real-IP $realip_remote_addr;
            proxy_set_header X-Forwarded-For $realip_remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_cookie_domain nginx-gateway $host;
            add_header Access-Control-Allow-Origin $scheme://$host always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $scheme://$host always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location /api/civilian/ {
            limit_req  zone=civilian_api burst=10 nodelay;
            limit_conn addr 10;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            # Use the pre-real-IP-module socket address so the backend DB rate
            # limiter cannot be bypassed by a spoofed X-Forwarded-For header.
            proxy_set_header X-Real-IP $realip_remote_addr;
            proxy_set_header X-Forwarded-For $realip_remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_cookie_domain nginx-gateway $host;
            add_header Access-Control-Allow-Origin $scheme://$host always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $scheme://$host always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location /api/ {
            limit_req  zone=general_api burst=50 nodelay;
            limit_conn addr 20;

            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_domain nginx-gateway $host;
            add_header Access-Control-Allow-Origin $scheme://$host always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $scheme://$host always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location = /auth/login {
            return 301 /login;
        }

        location = /auth/login/ {
            return 301 /login;
        }

        location = /report/tracking {
            return 301 /tracking$is_args$args;
        }

        location = /report/tracking/ {
            return 301 /tracking$is_args$args;
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
