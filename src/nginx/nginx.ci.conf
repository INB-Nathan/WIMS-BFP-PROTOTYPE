events {
    worker_connections 1024;
}

http {
    server_tokens off;
    proxy_hide_header X-Powered-By;

    upstream backend_servers {
        server backend:8000;
        keepalive 32;
    }

    client_max_body_size 50M;

    # CI-only HTTP server — no TLS, no certs required.
    # Used by GitHub Actions security-scan job via docker-compose.ci.yml.
    # Local dev using docker-compose.override.yml gets the HTTPS nginx.local.conf
    # (requires self-signed certs generated in .ssl/).
    # Production uses nginx.conf with real Let's Encrypt certs via docker-compose.prod.yml.
    server {
        listen 80;
        listen [::]:80;
        server_name localhost wimsbfp.tech;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","via":"nginx-gateway"}\n';
        }

        location /api/auth/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_domain nginx-gateway $host;
            add_header Access-Control-Allow-Origin $scheme://$host always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $scheme://$host always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location = /auth/login {
            return 301 /login;
        }

        location = /auth/login/ {
            return 301 /login;
        }

        location = /report/tracking {
            return 301 /tracking$is_args$args;
        }

        location = /report/tracking/ {
            return 301 /tracking$is_args$args;
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
