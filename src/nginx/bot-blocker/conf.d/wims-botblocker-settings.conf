# WIMS-BFP bot-blocker settings
# Defines zones required by upstream nginx-ultimate-bad-bot-blocker
# that are not defined by globalblacklist.conf itself.
#
# The `addr` zone is already defined by WIMS nginx.conf:
#   limit_conn_zone $binary_remote_addr zone=addr:10m;
# ddos.conf references it with `limit_conn addr 200;` — compatible.

# flood zone — used by ddos.conf (limit_req zone=flood burst=200 nodelay)
# 10m shared memory, 30r/s rate.
limit_req_zone $binary_remote_addr zone=flood:10m rate=30r/s;
