events {
    worker_connections 1024;
}

http {
    server_tokens off;
    proxy_hide_header X-Powered-By;

    upstream backend_servers {
        server backend:8000;
        keepalive 32;
    }

    client_max_body_size 50M;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name localhost wimsbfp.tech;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── TLS termination (self-signed certs mounted from host .ssl/) ──────────
    # Cert path inside container: /etc/letsencrypt/live/wimsbfp.tech/
    # On first clone, generate certs: see system-wiki/operations/local-dev-deploy-guide.md
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost wimsbfp.tech;

        ssl_certificate     /etc/letsencrypt/live/wimsbfp.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wimsbfp.tech/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy no-referrer always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","via":"nginx-gateway"}\n';
        }

        location /api/auth/ {
            proxy_pass http://frontend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_domain nginx-gateway $host;
            add_header Access-Control-Allow-Origin $scheme://$host always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin $scheme://$host always;
                add_header Access-Control-Allow-Credentials true always;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Authorization, Content-Type, Cookie' always;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        location = /auth/login {
            return 301 /login;
        }

        location = /auth/login/ {
            return 301 /login;
        }

        location = /report/tracking {
            return 301 /tracking$is_args$args;
        }

        location = /report/tracking/ {
            return 301 /tracking$is_args$args;
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        location / {
            proxy_pass http://frontend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
