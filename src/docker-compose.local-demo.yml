# Resource-conscious laptop topology. Use through scripts/wims-local.sh so the
# Compose project name and service set remain stable across integration branches.
#
# wims_internal subnet: the base compose pins 172.18.0.0/24, which collides with
# k3d clusters (they default to 172.18.0.0/16). This override re-homes the
# reduced stack onto 172.28.0.0/24 and keeps the base file's convention of
# reserving the lower half for static addresses (.3/.5/.7) with the dynamic
# allocation pool in the upper half (.128/25). Set WIMS_LOCAL_SUBNET (e.g.
# 10.40.0.0/24) for another range; scripts/wims-local.sh derives
# WIMS_LOCAL_SUBNET_RANGE and the WIMS_LOCAL_*_IP variables from it. Raw
# `docker compose` users with a custom subnet must set those derived variables
# themselves.
networks:
  wims_internal:
    ipam:
      config:
        - subnet: ${WIMS_LOCAL_SUBNET:-172.28.0.0/24}
          ip_range: ${WIMS_LOCAL_SUBNET_RANGE:-172.28.0.128/25}

services:
  postgres:
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=50"]
    restart: "no"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_POSTGRES_IP:-172.28.0.3}

  redis:
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: "no"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_REDIS_IP:-172.28.0.5}

  keycloak:
    restart: "no"
    # Re-point the base file's extra_hosts pins (172.18.0.x) at this stack's
    # subnet so Keycloak can reach postgres/redis through /etc/hosts.
    extra_hosts: !override
      - "postgres:${WIMS_LOCAL_POSTGRES_IP:-172.28.0.3}"
      - "redis:${WIMS_LOCAL_REDIS_IP:-172.28.0.5}"
    ports: !override
      - "127.0.0.1:8180:8080"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_KEYCLOAK_IP:-172.28.0.7}

  keycloak-bootstrap:
    restart: "no"

  backend:
    restart: "no"
    # Re-point the base file's extra_hosts pins (172.18.0.x) at this stack's
    # subnet; the ollama/osrm entries are dropped because those services are
    # not part of the reduced topology.
    extra_hosts: !override
      - "postgres:${WIMS_LOCAL_POSTGRES_IP:-172.28.0.3}"
      - "redis:${WIMS_LOCAL_REDIS_IP:-172.28.0.5}"
      - "keycloak:${WIMS_LOCAL_KEYCLOAK_IP:-172.28.0.7}"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_BACKEND_IP:-172.28.0.130}
    volumes: !override
      - incident_attachments_data:/app/storage
      - ./suricata/logs:/var/log/suricata:ro
      - ./postgres-init:/postgres-init:ro
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-bootstrap:
        condition: service_completed_successfully

  frontend:
    restart: "no"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_FRONTEND_IP:-172.28.0.131}

  nginx-gateway:
    restart: "no"
    # HTTP-only nginx.ci.conf (same mount as docker-compose.ci.yml) so nginx
    # starts without /etc/letsencrypt certificates. Note: nginx.ci.conf pins
    # set_real_ip_from to the base 172.18.0.0/24 subnet, which does not match
    # WIMS_LOCAL_SUBNET; that is cosmetic for this loopback-only stack because
    # local QA clients arrive from 127.0.0.1 (already trusted).
    volumes:
      - ./nginx/nginx.ci.conf:/etc/nginx/nginx.conf:ro
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_NGINX_IP:-172.28.0.132}
    ports: !override
      - "127.0.0.1:80:80"
