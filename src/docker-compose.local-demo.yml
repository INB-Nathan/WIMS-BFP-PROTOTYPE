# Resource-conscious laptop topology. Use through scripts/wims-local.sh so the
# Compose project name and service set remain stable across integration branches.
#
# Compose minimum: this file uses the !override merge tag (below), which
# requires Docker Compose v2.24+; older Compose fails to parse these files.
#
# Supported entry point: scripts/wims-local.sh, which always starts the
# explicit service list (postgres redis keycloak keycloak-bootstrap backend
# frontend nginx-gateway). Raw `docker compose up <extra-service>` is
# unsupported: inherited non-selected services (ollama, openbao,
# celery-worker, wims-suricata, ...) keep the base file's static 172.18.0.x
# addresses, which lie outside this stack's subnet, so their containers fail
# to create and would corrupt the local network.
#
# wims_internal subnet: the base compose pins 172.18.0.0/24, which collides with
# k3d clusters (they default to 172.18.0.0/16). This override re-homes the
# reduced stack onto 172.28.0.0/24 and keeps the base file's convention of
# reserving the lower half for static addresses (.3/.5/.7) with the dynamic
# allocation pool in the upper half (.128/25). Set WIMS_LOCAL_SUBNET (e.g.
# 10.40.0.0/24) for another range; scripts/wims-local.sh derives
# WIMS_LOCAL_SUBNET_RANGE and the WIMS_LOCAL_*_IP variables from it. /8 to
# /24 prefixes are accepted and host bits are masked onto the network boundary
# (e.g. 10.40.0.5/24 becomes 10.40.0.0/24); non-boundary addresses are NOT
# rejected. Raw `docker compose` users with a custom subnet must set those
# derived variables themselves.
networks:
  wims_internal:
    # Isolate from the base/full stack: the base file pins an explicit
    # `name: wims_internal`, so without this rename the reduced stack would
    # reuse (or conflict with) a network already created by the full stack,
    # silently ignoring WIMS_LOCAL_SUBNET. wims-local_* matches the name
    # Compose would otherwise generate for this project.
    name: wims-local_wims_internal
    ipam:
      config:
        - subnet: ${WIMS_LOCAL_SUBNET:-172.28.0.0/24}
          ip_range: ${WIMS_LOCAL_SUBNET_RANGE:-172.28.0.128/25}

services:
  postgres:
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=50"]
    restart: "no"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_POSTGRES_IP:-172.28.0.3}

  redis:
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: "no"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_REDIS_IP:-172.28.0.5}

  keycloak:
    restart: "no"
    # Keycloak 26 removed the v1 `hostname-url` option (dead config that only
    # logs a startup error). With no hostname pinned, KC 26 derives the
    # browser-visible URL from the request: nginx forwards /auth/ with
    # X-Forwarded-Host/Port at localhost:80, so the OIDC issuer and
    # authorization endpoints are http://localhost/auth/... — consistent with
    # the backend KEYCLOAK_ISSUER and the frontend same-origin /auth
    # authority. The 127.0.0.1:8180 mapping stays for direct admin/API access,
    # where Keycloak derives http://localhost:8180/auth from the Host header.
    environment:
      KC_HOSTNAME_URL: null
    # Re-point the base file's extra_hosts pins (172.18.0.x) at this stack's
    # subnet so Keycloak can reach postgres/redis through /etc/hosts.
    extra_hosts: !override
      - "postgres:${WIMS_LOCAL_POSTGRES_IP:-172.28.0.3}"
      - "redis:${WIMS_LOCAL_REDIS_IP:-172.28.0.5}"
    ports: !override
      - "127.0.0.1:8180:8080"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_KEYCLOAK_IP:-172.28.0.7}

  keycloak-bootstrap:
    restart: "no"

  backend:
    restart: "no"
    # Re-point the base file's extra_hosts pins (172.18.0.x) at this stack's
    # subnet; the ollama/osrm entries are dropped because those services are
    # not part of the reduced topology.
    extra_hosts: !override
      - "postgres:${WIMS_LOCAL_POSTGRES_IP:-172.28.0.3}"
      - "redis:${WIMS_LOCAL_REDIS_IP:-172.28.0.5}"
      - "keycloak:${WIMS_LOCAL_KEYCLOAK_IP:-172.28.0.7}"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_BACKEND_IP:-172.28.0.130}
    volumes: !override
      - incident_attachments_data:/app/storage
      - ./suricata/logs:/var/log/suricata:ro
      - ./postgres-init:/postgres-init:ro
    depends_on: !override
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-bootstrap:
        condition: service_completed_successfully

  frontend:
    restart: "no"
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_FRONTEND_IP:-172.28.0.131}

  nginx-gateway:
    restart: "no"
    # HTTP-only nginx.ci.conf (same mount as docker-compose.ci.yml) so nginx
    # starts without /etc/letsencrypt certificates. Note: nginx.ci.conf pins
    # set_real_ip_from to the base 172.18.0.0/24 subnet, which does not match
    # WIMS_LOCAL_SUBNET; that is cosmetic for this loopback-only stack because
    # local QA clients arrive from 127.0.0.1 (already trusted).
    volumes:
      - ./nginx/nginx.ci.conf:/etc/nginx/nginx.conf:ro
    networks:
      wims_internal:
        ipv4_address: ${WIMS_LOCAL_NGINX_IP:-172.28.0.132}
    ports: !override
      - "127.0.0.1:80:80"
