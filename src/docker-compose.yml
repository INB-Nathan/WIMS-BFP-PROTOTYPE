networks:
  wims_internal:
    driver: bridge
    name: wims_internal
    # Pen-test follow-up 2026-06-29: explicit subnet + static IPs for redis,
    # postgres, keycloak, openbao, and ollama. These IPs are referenced by
    # extra_hosts entries that bypass broken Docker DNS after wims_internal
    # network recreation on the live VPS (see PR #485-#487).
    # Keep dynamic allocations in 172.18.0.128/25 so short-lived/dynamic
    # containers cannot claim the low static addresses during parallel Compose
    # startup (observed as Docker 28 "Address already in use" in CI).
    ipam:
      config:
        - subnet: 172.18.0.0/24
          ip_range: 172.18.0.128/25

services:
  # --- Infrastructure & Databases ---
  postgres:
    # Pinned to PG 15 — PG 17 cannot read an existing PG 15 data volume.
    # See commit 0b90346d / PR #535.
    image: postgis/postgis:15-3.4-alpine
    container_name: wims-postgres
    command: ["postgres", "-c", "shared_buffers=2GB", "-c", "max_connections=75"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: wims
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      wims_internal:
        ipv4_address: 172.18.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wims"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:8.8-alpine
    container_name: wims-redis
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    # Pen-test follow-up 2026-06-29: pin redis to 172.18.0.5 (the IP the live
    # VPS was already using dynamically) so the wims-suricata `extra_hosts`
    # mapping below stays valid across `docker compose down && up` cycles.
    networks:
      wims_internal:
        ipv4_address: 172.18.0.5
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: wims-mailhog
    networks:
      - wims_internal
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  keycloak:
    image: ${KEYCLOAK_IMAGE:-wims-keycloak-demo-otp:local}
    build: ./keycloak
    container_name: wims-keycloak
    command: start-dev --import-realm --proxy-headers xforwarded --http-host=0.0.0.0
    # Pen-test follow-up 2026-06-29 (deploy fix): the `ipam.config.subnet`
    # added in PR #485 causes the wims_internal network to be recreated on
    # deploy. After recreation, the Docker embedded DNS does NOT consistently
    # resolve `postgres` from this keycloak container (verified on the live
    # VPS — `getent hosts postgres` returns empty even after a fresh
    # container recreate, while TCP to the static IP works). Inject the
    # mapping directly into /etc/hosts to bypass the broken DNS. Same fix
    # pattern as the wims-suricata `extra_hosts` in PR #485.
    extra_hosts:
      - "postgres:172.18.0.3"
      - "redis:172.18.0.5"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes/wims-bfp:/opt/keycloak/themes/wims-bfp:ro
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?error}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?error}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?error}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HOSTNAME_URL: http://localhost:8080/auth
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY: "true"
      # SMTP configuration (for Keycloak realm ${env.SMTP_*} placeholders)
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_FROM: ${SMTP_FROM:-noreply@wims-bfp.local}
      SMTP_FROM_DISPLAY: ${SMTP_FROM_DISPLAY:-WIMS-BFP}
      SMTP_REPLYTO: ${SMTP_REPLYTO:-no-reply@wimsbfp.tech}
      SMTP_REPLYTO_DISPLAY: ${SMTP_REPLYTO_DISPLAY:-WIMS-BFP No Reply}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # WS-B (RP-08/RP-18): Keycloak → WIMS audit event push
      WIMS_AUDIT_INGEST_URL: http://backend:8000/api/auth/keycloak-event
      WIMS_KEYCLOAK_EVENT_SECRET: ${WIMS_KEYCLOAK_EVENT_SECRET:-}
    networks:
      wims_internal:
        ipv4_address: 172.18.0.7
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /auth/ HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 8 cat <&3 | head -1 | grep -qE '^HTTP'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: always
    ports:
      - "127.0.0.1:8080:8080"

  keycloak-bootstrap:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: wims-keycloak-bootstrap
    entrypoint: ["/bin/sh", "/opt/keycloak/bootstrap/bootstrap-master-realm.sh"]
    volumes:
      - ./keycloak/bootstrap:/opt/keycloak/bootstrap:ro
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?error}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?error}
    networks:
      - wims_internal
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"

  # --- Key Management (OpenBao) ---
  openbao:
    image: openbao/openbao:2.5.5
    container_name: wims-openbao
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao_data:/vault/file
      - ./openbao/config:/vault/config:ro
    environment:
      BAO_SKIP_VERIFY: "true"
    networks:
      wims_internal:
        ipv4_address: 172.18.0.8
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://localhost:8200 -format=json >/tmp/hc.json 2>/dev/null && grep -q initialized.*true /tmp/hc.json && grep -q sealed.*false /tmp/hc.json"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: always
    entrypoint: ["bao", "server", "-config=/vault/config/openbao.hcl"]

  openbao-bootstrap:
    image: openbao/openbao:2.5.5
    container_name: wims-openbao-bootstrap
    entrypoint: ["/bin/sh", "/vault/init/bootstrap-openbao.sh"]
    volumes:
      - ./openbao/init:/vault/init:ro
      - ./openbao/config:/vault/config:ro
      - openbao_data:/vault/file
    environment:
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      OPENBAO_UNSEAL_KEY: ${OPENBAO_UNSEAL_KEY:-}
      OPENBAO_DEV_ROOT_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:-devroot}
    extra_hosts:
      - "openbao:172.18.0.8"
    networks:
      - wims_internal
    depends_on:
      openbao:
        condition: service_started
    restart: "no"

  ollama:
    image: ollama/ollama:0.30.10
    container_name: wims-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    networks:
      wims_internal:
        ipv4_address: 172.18.0.4
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 6gb
    restart: always

  ollama-model-pull:
    image: ollama/ollama:0.30.10
    container_name: wims-ollama-model-pull
    command: pull qwen2.5:3b
    environment:
      - OLLAMA_HOST=http://ollama:11434
    extra_hosts:
      - "ollama:172.18.0.4"
    networks:
      - wims_internal
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # --- Applications ---
  backend:
    image: ${BACKEND_IMAGE:-wims-backend:local}
    build: ./backend
    container_name: wims-backend
    # Temporary VPS hotfix: single worker avoids concurrent startup DDL deadlock.
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--limit-concurrency", "200", "--timeout-keep-alive", "5", "--lifespan", "off"]
    # Pen-test follow-up 2026-06-29 (deploy fix): see keycloak comment above
    # for rationale. Same Docker DNS unreliability after wims_internal
    # network recreation. Inject the hostnames the backend connects to into
    # /etc/hosts. OSRM is production-only; its entry is inert when routing is disabled.
    extra_hosts:
      - "postgres:172.18.0.3"
      - "redis:172.18.0.5"
      - "keycloak:172.18.0.7"
      - "ollama:172.18.0.4"
      - "osrm:172.18.0.9"
    environment:
      - DATABASE_URL=postgresql://wims_app_user:wimsapp@postgres:5432/wims
      - DATABASE_ADMIN_URL=postgresql://postgres:${POSTGRES_PASSWORD:?error}@postgres:5432/wims
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - KEYCLOAK_REALM_URL=http://keycloak:8080/auth/realms/bfp
      - KEYCLOAK_ISSUER=http://localhost/auth/realms/bfp
      - KEYCLOAK_CLIENT_ID=wims-web
      - KEYCLOAK_AUDIENCE=wims-web
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      - KEYCLOAK_ADMIN_USER=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?error}
      - OLLAMA_URL=http://ollama:11434
      - SURICATA_EVE_PATH=/var/log/suricata/eve.json
      - AFOR_TEMPLATE_PATH=/app/AFOR-FORMATTED.xlsx
      - CSRF_TRUSTED_ORIGINS=http://localhost,https://localhost,http://127.0.0.1,http://127.0.0.1:3000,http://localhost:8090,http://localhost:3000,http://localhost:8000
      - NEXT_PUBLIC_APP_URL=http://localhost
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://openbao:8200}
      - OPENBAO_TOKEN=
      - OPENBAO_TOKEN_FILE=/openbao-creds/.wims-app-token
      - OPENBAO_TRANSIT_MOUNT=${OPENBAO_TRANSIT_MOUNT:-transit}
      - WIMS_CRYPTO_PROVIDER=${WIMS_CRYPTO_PROVIDER:-env_aesgcm}
      # WS-B (RP-08/RP-18): shared secret for Keycloak → WIMS audit event push
      - WIMS_KEYCLOAK_EVENT_SECRET=${WIMS_KEYCLOAK_EVENT_SECRET:-}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-256}
      # Phase-2 civilian photo storage (shared volume, backend+worker)
      - CIVILIAN_PHOTO_STORAGE_DIR=/app/storage/civilian-photos
      # Phase-3 Turnstile CAPTCHA
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
    volumes:
      - incident_attachments_data:/app/storage
      - ./suricata/logs:/var/log/suricata:ro
      - ./postgres-init:/postgres-init:ro
      - openbao_data:/openbao-creds:ro
    networks:
      - wims_internal
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-bootstrap:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"

  celery-worker:
    image: ${BACKEND_IMAGE:-wims-backend:local}
    build: ./backend
    container_name: wims-celery-worker
    # CELERY BEAT SINGLETON HAZARD: the embedded `--beat` makes this container the
    # Celery scheduler. Because there is exactly ONE `celery-worker` service/container,
    # this beat is a de-facto SINGLETON today. Do NOT set `deploy.replicas > 1` or run
    # multiple `celery-worker` instances without first (a) moving `--beat` to a dedicated
    # single-instance beat service, or (b) adding leader election. Otherwise multiple beat
    # schedulers launch and duplicate periodic tasks (e.g. double-archive in
    # tasks.expire_content). The task idempotency (tasks.expire_content only transitions
    # already-expired PUBLISHED rows) is a safety net, NOT a license to run duplicate
    # schedulers.
    command: celery -A main.celery_app worker --beat --loglevel=info
    # Pen-test follow-up 2026-06-29 (deploy fix): see keycloak comment above
    # for rationale. Same set of hostnames as the backend.
    extra_hosts:
      - "postgres:172.18.0.3"
      - "redis:172.18.0.5"
      - "keycloak:172.18.0.7"
      - "ollama:172.18.0.4"
      - "osrm:172.18.0.9"
    environment:
      - DATABASE_URL=postgresql://wims_app_user:wimsapp@postgres:5432/wims
      - REDIS_URL=redis://redis:6379/0
      - KEYCLOAK_REALM_URL=http://keycloak:8080/auth/realms/bfp
      - OLLAMA_URL=http://ollama:11434
      - SURICATA_EVE_PATH=/var/log/suricata/eve.json
      - EXPORT_DIR=/app/storage/exports
      - AFOR_TEMPLATE_PATH=/app/AFOR-FORMATTED.xlsx
      - NEXT_PUBLIC_APP_URL=http://localhost
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-creds.json
      - SMTP_HOST=${SMTP_HOST:-smtp-relay.brevo.com}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_FROM=${SMTP_FROM:-noreply@wims-bfp.local}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - OPENBAO_ADDR=${OPENBAO_ADDR:-http://openbao:8200}
      - OPENBAO_TOKEN=
      - OPENBAO_TOKEN_FILE=/openbao-creds/.wims-app-token
      - OPENBAO_TRANSIT_MOUNT=${OPENBAO_TRANSIT_MOUNT:-transit}
      - WIMS_CRYPTO_PROVIDER=${WIMS_CRYPTO_PROVIDER:-env_aesgcm}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-256}
      # MaxMind GeoLite2-City for IMPOSSIBLE_TRAVEL anomaly detector.
      # Download GeoLite2-City.mmdb from maxmind.com and place it in ./geoip/.
      # Detector silently skips if the file is absent.
      - GEOIP_DB_PATH=/app/geoip/GeoLite2-City.mmdb
      # Phase-2 civilian photo storage (shared volume, backend+worker)
      - CIVILIAN_PHOTO_STORAGE_DIR=/app/storage/civilian-photos
    volumes:
      - ./suricata/logs:/var/log/suricata:ro
      - ./postgres-init:/postgres-init:ro
      - incident_attachments_data:/app/storage
      - openbao_data:/openbao-creds:ro
      - ./firebase-creds.json:/app/firebase-creds.json:ro
      - ./geoip:/app/geoip:ro
      # SECURITY NOTE: Docker socket mount is required for live Suricata rule
      # reload (suricata-update + kill -USR2). Without the socket, the Celery
      # worker cannot exec into the wims-suricata container to trigger a
      # graceful rule reload. A shared rules volume alone cannot deliver USR2.
      # Risk: broad Docker daemon access inside the Celery container.
      # Mitigation: Celery worker runs with the least-privileged service
      # account and only interacts with the wims-suricata container by name.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - wims_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully

  frontend:
    image: ${FRONTEND_IMAGE:-wims-frontend:local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_AUTH_API_URL: /auth
        NEXT_PUBLIC_BASE_URL: http://localhost
        NEXT_PUBLIC_OIDC_REDIRECT_URI: http://localhost/callback
        NEXT_PUBLIC_OIDC_AUTHORITY: /auth/realms/bfp
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-wims-bfp.firebaseapp.com}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-wims-bfp}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-wims-bfp.firebasestorage.app}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-465171995576}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-1:465171995576:web:9aa2403d8f6b9c4bb50d4d}
        NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
    container_name: wims-frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_AUTH_API_URL=/auth
      - NEXT_PUBLIC_BASE_URL=http://localhost
      - NEXT_PUBLIC_OIDC_REDIRECT_URI=http://localhost/callback
      - NEXT_PUBLIC_OIDC_AUTHORITY=/auth/realms/bfp
      - NEXT_PUBLIC_OIDC_CLIENT_ID=wims-web
      - NEXT_PUBLIC_APP_URL=http://localhost
      - AUTH_SERVER_URL=http://nginx-gateway/auth
      - BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY:-}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-wims-bfp.firebaseapp.com}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-wims-bfp}
      - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-wims-bfp.firebasestorage.app}
      - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-465171995576}
      - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID:-1:465171995576:web:9aa2403d8f6b9c4bb50d4d}
      - NEXT_PUBLIC_FIREBASE_VAPID_KEY=${NEXT_PUBLIC_FIREBASE_VAPID_KEY:-}
      # Phase-3 Turnstile CAPTCHA
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    networks:
      - wims_internal
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  wims-suricata:
    image: jasonish/suricata:8.0.5
    container_name: wims-suricata
    restart: unless-stopped
    network_mode: "host"
    environment:
      # Match the wims host user (UID 1000) so the entrypoint's chown -R
      # on /etc/suricata, /var/lib/suricata, and /var/log/suricata doesn't
      # change bind-mount ownership to an unmatched UID, which would block
      # subsequent git operations (pull, reset) by the wims user.
      - PUID=1000
      - PGID=1000
      # Docker bridge for decrypted HTTP capture (G-4). Auto-detected by
      # entrypoint.sh; override via SURICATA_INTERFACE if a single interface
      # is needed (e.g. SURICATA_INTERFACE=eth0).
      - SURICATA_INTERFACE=
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE       # needed for CPU affinity on multi-interface AF_PACKET capture (G-4)
    command: /entrypoint.sh
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1g
        reservations:
          memory: 512m
    # Pen-test follow-up 2026-06-29: wims-suricata uses network_mode: "host"
    # for AF_PACKET raw-socket capture, so it does NOT participate in the
    # wims_internal bridge network and Docker DNS cannot resolve `redis` for
    # it. `extra_hosts` injects the mapping into the container's /etc/hosts
    # (separate from the host's /etc/hosts even with host networking). The
    # 172.18.0.5 IP is pinned by the redis service's `ipv4_address` above.
    extra_hosts:
      - "redis:172.18.0.5"
    volumes:
      - ./suricata/logs:/var/log/suricata
      - ./suricata/rules:/var/lib/suricata/rules
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml
      - ./suricata/entrypoint.sh:/entrypoint.sh
    healthcheck:
      test: ["CMD", "pgrep", "Suricata-Main"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # --- Edge Gateway ---
  nginx-gateway:
    image: nginx:1.30.3-alpine
    container_name: wims-nginx-gateway
    ports:
      - "80:80"
      - "443:443"
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/bot-blocker:/etc/nginx/bot-blocker:ro
      # TLS certificates are production-only — mount via docker-compose.prod.yml or deployment override
    networks:
      - wims_internal
    depends_on:
      - backend
      - frontend
      - keycloak

volumes:
  postgres_data:
  ollama_data:
  incident_attachments_data:
  openbao_data:
